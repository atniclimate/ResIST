<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATNI ResIST</title>
<meta name="description" content="Search the resolutions of the Affiliated Tribes of Northwest Indians: verbatim clauses, citations and source PDFs, running entirely in your browser.">
<link rel="icon" href="atni-logo.jpg">
<style>
  /* Tokens from src/static/css/design-system.css */
  :root {
    --white: #FFFFFF; --warm-white: #FAF8F5; --cream: #F5F0EA; --line: #D4C5B0; --line-faint: #E8DFD3;
    --earth: #6B4E37; --earth-dark: #4A3425; --orange: #B85A1B; --text-primary: #2C2418;
    --text-secondary: #5E5244; --mark: #F7DDBE;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.55;
         color: var(--text-primary); background: var(--cream); }
  a { color: var(--earth); } a:hover { color: var(--orange); }
  :focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  header { background: var(--white); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; }
  .bar img { width: 44px; height: 44px; border-radius: 4px; }
  .brand { font-weight: 700; font-size: 1.15rem; color: var(--earth-dark); text-decoration: none; }
  .brand small { display: block; font-weight: 400; font-size: .8rem; color: var(--text-secondary); }
  nav { margin-left: auto; display: flex; gap: 16px; }
  form.search { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0 8px; }
  form.search input[type=search] { flex: 1 1 260px; min-width: 0; padding: 10px 12px; font-size: 1rem;
         border: 1px solid var(--line); border-radius: 4px; background: var(--white); }
  select, button { padding: 10px 12px; font-size: 1rem; border: 1px solid var(--line); border-radius: 4px;
         background: var(--white); color: var(--text-primary); }
  button { background: var(--earth); color: var(--white); border-color: var(--earth); cursor: pointer; }
  .meta { color: var(--text-secondary); font-size: .9rem; }
  .card { background: var(--white); border: 1px solid var(--line-faint); border-radius: 4px;
          padding: 14px 16px; margin: 10px 0; }
  .card h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .card p { margin: 6px 0 0; overflow-wrap: anywhere; }
  mark { background: var(--mark); color: inherit; padding: 0 1px; }
  .badge { display: inline-block; font-size: .75rem; padding: 1px 6px; border-radius: 3px;
           border: 1px solid var(--line); color: var(--text-secondary); margin-left: 6px; }
  .badge.warn { border-color: var(--orange); color: var(--orange); }
  .years { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin: 12px 0; }
  .years a { display: block; text-align: center; background: var(--white); border: 1px solid var(--line-faint);
             border-radius: 4px; padding: 6px 2px; text-decoration: none; font-size: .9rem; }
  .years a span { display: block; color: var(--text-secondary); font-size: .75rem; }
  .years a[aria-current] { border-color: var(--earth); background: var(--warm-white); font-weight: 700; }
  ol.clauses { padding-left: 1.4rem; } ol.clauses li { margin: 8px 0; overflow-wrap: anywhere; }
  h2 { color: var(--earth-dark); margin: 20px 0 6px; } h3.sec { margin: 22px 0 6px; color: var(--earth-dark); }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0; }
  dl.facts dt { color: var(--text-secondary); } dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  pre.full { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--warm-white); padding: 12px;
             border: 1px solid var(--line-faint); font-size: .85rem; }
  .notice { background: var(--warm-white); border-left: 4px solid var(--orange); padding: 10px 14px; margin: 16px 0; }
  footer { margin: 40px 0 24px; color: var(--text-secondary); font-size: .85rem; }
  .pager { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
  #status { margin: 24px 0; }
</style>
</head>
<body>
<header><div class="wrap bar">
  <img src="atni-logo.jpg" alt="">
  <a class="brand" href="#/">ATNI ResIST<small>Resolution Information Synthesis Tool</small></a>
  <nav aria-label="Main"><a href="#/">Search</a><a href="#/about">About</a></nav>
</div></header>
<main class="wrap" id="main">
  <p id="status" role="status">Loading the resolution database…</p>
</main>
<script type="module">
// Version pinned; FTS5 is required and the stock sql.js build lacks it.
import sqlite3InitModule from "https://cdn.jsdelivr.net/npm/@sqlite.org/sqlite-wasm@3.53.0-build1/dist/index.mjs";

const PAGE = 25;
const main = document.getElementById("main");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let db, build;

async function load() {
  const status = document.getElementById("status");
  const [sqlite3, res, info] = await Promise.all([
    sqlite3InitModule(), fetch("resolutions.db"), fetch("build.json").then(r => r.json())]);
  if (!res.ok) throw new Error(`resolutions.db: HTTP ${res.status}`);
  build = info;
  const total = Number(res.headers.get("content-length")) || 0, reader = res.body.getReader(), chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    if (total) status.textContent = `Loading the resolution database… ${Math.round(got / total * 100)}%`;
  }
  const bytes = new Uint8Array(got);
  let off = 0; for (const c of chunks) { bytes.set(c, off); off += c.length; }
  const p = sqlite3.wasm.allocFromTypedArray(bytes);
  db = new sqlite3.oo1.DB();
  const rc = sqlite3.capi.sqlite3_deserialize(db.pointer, "main", p, bytes.length, bytes.length,
    sqlite3.capi.SQLITE_DESERIALIZE_FREEONCLOSE | sqlite3.capi.SQLITE_DESERIALIZE_READONLY);
  if (rc) throw new Error(`sqlite3_deserialize failed (${rc})`);
}

const rows = (sql, bind = []) => db.exec({ sql, bind, rowMode: "object", returnValue: "resultRows" });

// User text becomes quoted FTS5 terms (implicit AND), so no query syntax can error or inject.
function ftsQuery(q) {
  const terms = q.match(/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu) || [];
  return terms.map(t => `"${t.replace(/"/g, "")}"`).join(" ");
}

function params() {
  const [path, query = ""] = location.hash.slice(1).split("?");
  return { path: path || "/", q: new URLSearchParams(query) };
}

function searchView(q) {
  const text = q.get("q") || "", year = q.get("year") || "", page = Math.max(1, Number(q.get("page")) || 1);
  const years = rows("select convention_year y, count(*) n from resolution where convention_year is not null group by y order by y");
  const match = ftsQuery(text);
  const where = [], bind = [];
  if (match) { where.push("resolution_fts match ?"); bind.push(match); }
  if (year) { where.push("r.convention_year = ?"); bind.push(Number(year)); }
  const from = match ? "resolution_fts join resolution r on r.id = resolution_fts.rowid" : "resolution r";
  const cond = where.length ? "where " + where.join(" and ") : "";
  const total = rows(`select count(*) n from ${from} ${cond}`, bind)[0].n;
  const order = match ? "bm25(resolution_fts)" : "r.convention_year desc, r.resolution_number desc";
  const snip = match ? "snippet(resolution_fts, 2, char(2), char(3), ' … ', 24)" : "null";
  const hits = rows(`select r.id, r.resolution_number, r.title, r.convention_name, r.convention_year, r.needs_review,
      ${snip} snip from ${from} ${cond} order by ${order} limit ${PAGE} offset ${(page - 1) * PAGE}`, bind);
  const link = (y, pg) => "#/?" + new URLSearchParams({ ...(text && { q: text }), ...(y && { year: y }), ...(pg > 1 && { page: pg }) });
  const pages = Math.ceil(total / PAGE);
  main.innerHTML = `
    <form class="search" role="search">
      <label for="q" class="meta" style="flex-basis:100%">Search ${build.resolutions.toLocaleString()} ATNI resolutions (${build.year_min}–${build.year_max})</label>
      <input id="q" type="search" name="q" value="${esc(text)}" placeholder="e.g. salmon treaty rights, climate adaptation, 23-40">
      <select name="year" aria-label="Year"><option value="">All years</option>
        ${years.map(y => `<option ${String(y.y) === year ? "selected" : ""}>${y.y}</option>`).join("")}</select>
      <button>Search</button>
    </form>
    <nav class="years" aria-label="Resolutions by year">
      ${years.map(y => `<a href="${link(String(y.y) === year ? "" : y.y, 1)}" ${String(y.y) === year ? 'aria-current="true"' : ""}>${y.y}<span>${y.n}</span></a>`).join("")}
    </nav>
    <p class="meta">${total.toLocaleString()} result${total === 1 ? "" : "s"}${match ? ", ranked by BM25" : ", newest first"}</p>
    ${hits.map(h => `<article class="card">
      <h3><a href="#/r/${h.id}">${esc(h.resolution_number)} — ${esc(h.title)}</a>${h.needs_review ? '<span class="badge warn">OCR, unreviewed</span>' : ""}</h3>
      <div class="meta">${esc(h.convention_name || "")} ${esc(h.convention_year || "")}</div>
      ${h.snip ? `<p>${esc(h.snip).replace(/\u0002/g, "<mark>").replace(/\u0003/g, "</mark>")}</p>` : ""}
    </article>`).join("")}
    ${pages > 1 ? `<div class="pager">${page > 1 ? `<a href="${link(year, page - 1)}">← Previous</a>` : ""}
      <span class="meta">Page ${page} of ${pages}</span>${page < pages ? `<a href="${link(year, page + 1)}">Next →</a>` : ""}</div>` : ""}`;
  main.querySelector("form").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target);
    location.hash = "#/?" + new URLSearchParams([...f].filter(([, v]) => v));
  });
}

function detailView(id) {
  const r = rows("select * from resolution where id = ?", [id])[0];
  if (!r) { main.innerHTML = `<h2>Not found</h2><p><a href="#/">Back to search</a></p>`; return; }
  const st = rows("select statement_type t, text from statement where resolution_id = ? order by statement_type desc, \"index\"", [id]);
  const cites = rows("select c.text, c.citation_type, c.linked_resolution_id l, t.resolution_number n from citation c left join resolution t on t.id = c.linked_resolution_id where c.resolution_id = ?", [id]);
  const citedBy = rows("select distinct r.id, r.resolution_number, r.title from citation c join resolution r on r.id = c.resolution_id where c.linked_resolution_id = ? and r.id != ?", [id, id]);
  const committee = rows("select name from sponsor where resolution_id = ? and sponsor_type = 'committee'", [id]).map(s => s.name);
  const sources = rows("select url from source where document_id = ?", [r.document_id]).map(s => s.url);
  const list = (t) => st.filter(s => s.t === t);
  main.innerHTML = `
    <p><a href="#/">← Search</a></p>
    <h2>Resolution ${esc(r.resolution_number)}</h2>
    <p style="font-size:1.15rem;margin:0">${esc(r.title)}</p>
    ${r.needs_review ? `<div class="notice">This document is a scan. Its text was produced by OCR and has not been reviewed; read the PDF for the authoritative wording.</div>` : ""}
    <dl class="facts">
      <dt>Convention</dt><dd>${esc(r.convention_name || "—")} ${esc(r.convention_year || "")}</dd>
      ${r.date_adopted ? `<dt>Date</dt><dd>${esc(r.date_adopted)}</dd>` : ""}
      ${committee.length ? `<dt>Committee</dt><dd>${committee.map(esc).join("; ")}</dd>` : ""}
      <dt>Source PDF</dt><dd>${sources.map(u => `<a href="${esc(u)}" rel="noopener">${esc(u.replace("https://atnitribes.org/wp-content/uploads/", ""))}</a>`).join("<br>") || "—"}</dd>
      <dt>SHA-256</dt><dd><code>${esc(r.document_id)}</code></dd>
    </dl>
    <h3 class="sec">Resolved (${list("resolved").length})</h3>
    <ol class="clauses">${list("resolved").map(s => `<li>${esc(s.text)}</li>`).join("") || "<li>No RESOLVED clause was recognized; see the full text below.</li>"}</ol>
    <h3 class="sec">Whereas (${list("whereas").length})</h3>
    <ol class="clauses">${list("whereas").map(s => `<li>${esc(s.text)}</li>`).join("")}</ol>
    ${cites.length ? `<h3 class="sec">Citations (${cites.length})</h3><ul>${cites.map(c =>
      `<li>${c.l ? `<a href="#/r/${c.l}">${esc(c.text)}</a> (ATNI ${esc(c.n)})` : esc(c.text)} <span class="meta">${esc(c.citation_type.replace(/_/g, " "))}</span></li>`).join("")}</ul>` : ""}
    ${citedBy.length ? `<h3 class="sec">Cited by (${citedBy.length})</h3><ul>${citedBy.map(c =>
      `<li><a href="#/r/${c.id}">${esc(c.resolution_number)} — ${esc(c.title)}</a></li>`).join("")}</ul>` : ""}
    <details><summary>Full extracted text</summary><pre class="full">${esc(r.full_text)}</pre></details>`;
}

function aboutView() {
  main.innerHTML = `<h2>About</h2>
    <p>ResIST makes the resolutions of the Affiliated Tribes of Northwest Indians searchable: when ATNI resolved something, through which committee, and on what cited authority.</p>
    <p>Everything shown is ATNI's own published text, quoted verbatim. Clauses are extracted by fixed rules from the PDFs ATNI publishes at <a href="https://atnitribes.org/resolutions/">atnitribes.org</a>. Nothing on this site is generated, summarized or paraphrased by AI. The PDF is always the authoritative version, and every record links to it with its SHA-256.</p>
    <p>The whole database (${build.resolutions.toLocaleString()} documents, ${build.year_min}–${build.year_max}) is downloaded once and searched in your browser with SQLite full-text search and BM25 ranking. No query leaves your device.</p>
    <p>Known limits of this prototype: ${build.needs_review} scanned documents were read by OCR and are not yet reviewed; some resolution numbers appear on more than one PDF (amended or re-posted versions are kept separate); adoption dates come from file names where ATNI provided them.</p>
    <p class="meta">Built ${esc(build.built)} from ResIST commit <code>${esc(build.commit)}</code>, database SHA-256 <code>${esc(build.db_sha256.slice(0, 16))}…</code>. Code: <a href="https://github.com/atniclimate/ResIST">github.com/atniclimate/ResIST</a> (AGPL-3.0-or-later).</p>`;
}

function route() {
  const { path, q } = params();
  if (path.startsWith("/r/")) detailView(Number(path.slice(3)));
  else if (path === "/about") aboutView();
  else searchView(q);
  document.title = "ATNI ResIST";
  window.scrollTo(0, 0);
}

try {
  await load();
  addEventListener("hashchange", route);
  route();
} catch (e) {
  document.getElementById("status").textContent = `Could not load the database: ${e.message}`;
}
</script>
<div class="wrap"><footer>Verbatim text from resolutions published by the Affiliated Tribes of Northwest Indians. Not an official ATNI record; the source PDF governs.</footer></div>
</body>
</html>
