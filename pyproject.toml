[build-system]
requires = ["setuptools>=69"]
# NOTE: this ceiling governs the ISOLATED BUILD environment only and never meets the runtime
# pin. The runtime setuptools is capped at <82 transitively by sumy (because breadability
# imports pkg_resources, removed in setuptools 82), which is what holds CVE-2026-59890 open.
# See docs/security/dependency-scan-2026-09.md finding 3. Do not 'fix' this line for that CVE.
build-backend = "setuptools.build_meta"

[project]
name = "atni-resist"
version = "0.2.0.dev0"
description = "ATNI-ResIST: Resolution Information Synthesis Tool for the Affiliated Tribes of Northwest Indians. Local, offline, no-LLM resolution archive with classical retrieval and provenance."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# OQ7 answered by D-051 (PyMuPDF is AGPLv3). Table form because the build floor is setuptools 69, pre-PEP 639.
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "ATNI Climate / Affiliated Tribes of Northwest Indians" }]

# Core: everything the test-only install needs. No OCR engines, no WeasyPrint (R0.5 rule).
# Upper bounds are next-major caps; the hash-locked constraints file pins exact versions.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlmodel>=0.0.24,<1",
  "sqlalchemy>=2.0,<3",          # imported directly (text, aliased); H03
  "pydantic>=2.0,<3",            # imported directly via sqlmodel models; H03
  "python-multipart>=0.0.20,<1",
  "jinja2>=3.1,<4",
  "pymupdf>=1.26,<2",            # AGPL-3.0; PdfBackend seam at R2.23 keeps pypdfium2 swappable
  "eyecite>=2.7,<3",
  "networkx>=3.0,<4",
  "python-dateutil>=2.9,<3",
  "sumy>=0.11,<1",
  "nltk>=3.8,<4",                # offline; no nltk.download at runtime (DG-9)
  "python-docx>=1.1,<2",         # used by src/export and by intake (R1.25)
  "pillow>=12.3,<13",            # 12.3 clears all 25 of the 2026 advisories; the old <12 cap blocked every fix
]

[project.optional-dependencies]
# OCR engines. paddleocr/paddlepaddle pinned to exact minors: this pair is the demonstrated breaking change (D-004).
ocr = [
  "paddleocr==3.4.*",
  "paddlepaddle==3.2.*",
  "pytesseract>=0.3.10,<1",
]
# PDF export via WeasyPrint needs GTK3 on Windows; R4.5 replaces it with LibreOffice headless.
export = [
  "weasyprint>=69,<70",          # 69.0 clears CVE-2025-68616 (SSRF via redirect), CVE-2026-49452 (CSS injection), CVE-2024-28184
]
dev = [
  "pytest>=8.0,<10",
  "httpx>=0.27,<1",              # fastapi.testclient
  "pyyaml>=6.0,<7",              # spine/roadmap validation
  "ruff>=0.5,<1",
]

[tool.setuptools]
packages = ["src", "src.api", "src.export", "src.ingestion", "src.ingestion.ocr", "src.storage", "src.analysis", "src.models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::SyntaxWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 110
